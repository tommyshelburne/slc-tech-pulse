name: Aggregate jobs

on:
  schedule:
    # Daily at 13:00 UTC (07:00 MDT / 06:00 MST)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p .secrets
          echo "$FIREBASE_SERVICE_ACCOUNT" > .secrets/firebase-admin.json

      - name: Run aggregator
        run: npm run aggregate:jobs
