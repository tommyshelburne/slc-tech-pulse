<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Flat background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Top-left brand lockup -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#4f46e5"/>
    <text x="28" y="12"
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
          font-size="14"
          font-weight="600"
          letter-spacing="2.5"
          fill="#f0f0f8">SLC TECH PULSE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="300"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="80"
        font-weight="600"
        fill="#f0f0f8"
        letter-spacing="-2.5">Every tech event, job,</text>
  <text x="80" y="395"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="80"
        font-weight="600"
        fill="#f0f0f8"
        letter-spacing="-2.5">and company in SLC.</text>

  <!-- Supporting line -->
  <text x="80" y="455"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="22"
        font-weight="400"
        fill="#8888a8"
        letter-spacing="-0.3">Utah's tech scene. Aggregated in one place.</text>

  <!-- Minimal geometric peaks (bottom-right) -->
  <g transform="translate(740, 350)">
    <!-- Three flat triangular peaks, descending scale -->
    <polygon points="0,180 90,40 180,180" fill="none" stroke="#2a2a3a" stroke-width="2"/>
    <polygon points="120,180 210,80 300,180" fill="none" stroke="#2a2a3a" stroke-width="2"/>
    <polygon points="240,180 330,20 420,180" fill="#4f46e5" fill-opacity="0.12" stroke="#4f46e5" stroke-width="2"/>

    <!-- Tiny dot at apex of accent peak -->
    <circle cx="330" cy="20" r="4" fill="#818cf8"/>
  </g>

  <!-- Thin bottom rule + URL -->
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#1e1e2a" stroke-width="1"/>
  <text x="80" y="585"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="15"
        font-weight="500"
        fill="#8888a8"
        letter-spacing="0.3">slc-tech-pulse.web.app</text>
  <text x="1120" y="585"
        text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
        font-size="15"
        font-weight="500"
        fill="#8888a8"
        letter-spacing="0.3">Events · Jobs · Companies</text>
</svg>
